name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sharelink
          POSTGRES_PASSWORD: sharelink
          POSTGRES_DB: sharelink
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U sharelink"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://sharelink:sharelink@127.0.0.1:5432/sharelink
      APP_BASE_URL: http://localhost:3000
      ANALYTICS_HASH_SECRET: ci-only-analytics-secret
      ADMIN_BOOTSTRAP_CODE: 2012
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run db:migrate
      - run: npm run typecheck
      - run: npm run build
